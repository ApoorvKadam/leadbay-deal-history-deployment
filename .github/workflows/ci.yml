name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Activate pnpm 9.15.4
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          node --version
          pnpm --version

      - name: Install committed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile remains unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Audit production dependencies
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test compiled CLI contract
        env:
          LEADBAY_TEST_CLI_ENTRY: dist/cli.js
        run: pnpm vitest run test/integration/cli.test.ts

      - name: Verify deterministic fixture source
        run: pnpm fixtures:check

      - name: Run compiled mock-only Leadbay MCP demo
        env:
          LEADBAY_MOCK: '1'
          LEADBAY_BASE_URL: https://leadbay.invalid
        run: node dist/cli.js demo --case fixtures/building-materials-distributor --out artifacts/building-materials-distributor

      - name: Upload real MCP evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-mcp-evidence-${{ matrix.os }}
          path: artifacts/building-materials-distributor/
          if-no-files-found: error
          retention-days: 90

      - name: Verify tracked tree remains unchanged
        run: git diff --exit-code
